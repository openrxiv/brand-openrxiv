color:
  palette:
    black: "#0B0903"
    white: "#FFFFFF"
    bright-green: "#00BE27"
    medium-green: "#027116"
    dark-green: "#1F2A20"
    light-gray: "#EAEAEA"
    dark-gray: "#1F2A20"
    light-blue: "#C9EAE7"
    cream: "#EBE9C7"
    purple: "#B6B1D7"
  background: white
  foreground: black
  primary: medium-green
  secondary: bright-green

logo: 
  medium: logos/openrxiv-logo.png

typography:
  fonts:
    - family: Geist
      source: google
    - family: Space Mono
      source: google
  base: Geist
  headings: Geist
  link:
    decoration: underline
    color: secondary
  monospace: Space Mono
  monospace-inline:
    color: dark-green
    background-color: light-gray
  monospace-block:
    color: medium-green
    background-color: light-gray

defaults:
  bootstrap:
    defaults:
      navbar-bg: "$brand-light-gray"  
      navbar-fg: "$brand-black"